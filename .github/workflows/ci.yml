name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the minimum supported toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Check design example formatting
        run: rustfmt +1.97.1 --edition 2024 --check docs/examples/*.rs
      - name: Check the workspace
        run: cargo +1.97.1 check --workspace --all-targets --locked
      - name: Run clippy
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo +1.97.1 test --workspace --locked
